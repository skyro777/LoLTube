name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build LoLTube (debug + release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        run: |
          if [ -n "${{ secrets.LOLTUBE_KEYSTORE_BASE64 }}" ]; then
            mkdir -p keystore
            echo "${{ secrets.LOLTUBE_KEYSTORE_BASE64 }}" | base64 -d > keystore/loltube-release.p12
            echo "release keystore restored from secret"
          else
            echo "no keystore secret - release APK will be debug-signed"
          fi

      - name: Build
        run: ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Rename artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/LoLTube-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/LoLTube-release.apk || true
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LoLTube-APK
          path: out/*.apk
          retention-days: 30

      - name: Rolling release (main branch)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/*.apk \
            --title "LoLTube Latest Build" \
            --notes "Automated build of \`main\` @ ${GITHUB_SHA::7}. Install **LoLTube-release.apk** (signed, smoothest playback). The debug APK is for diagnostics." \
            --latest

      - name: Versioned release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.apk \
            --title "LoLTube $GITHUB_REF_NAME" \
            --notes "Release $GITHUB_REF_NAME" \
            --latest
